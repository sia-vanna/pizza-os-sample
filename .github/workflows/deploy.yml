name: Deploy pizza-os to droplet

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/pizza-os
            git pull origin main
            npm install --production
            nasm -f elf32 boot.asm -o boot.o
            g++ -m32 -ffreestanding -O2 -c kernel.cpp -o kernel.o
            g++ -m32 -ffreestanding -O2 -c ai_model.cpp -o ai_model.o || echo 'extern "C" void ai_stub(){}' | g++ -m32 -ffreestanding -O2 -c -x c++ - -o ai_model.o
            ld -m elf_i386 -T linker.ld -o pizza-os.bin boot.o kernel.o ai_model.o -nostdlib
            cp pizza-os.bin /var/www/pizza-os/ || mkdir -p /var/www/pizza-os && cp pizza-os.bin /var/www/pizza-os/
            pm2 restart pizza-os || pm2 start server.js --name pizza-os
            pm2 save
            echo "🍕 Deployed!"
